<!-- The welcome. Before the room with the screen there is the room
     with the sign, and a visitor who has not yet said which language
     they read. Scrolling seats the letters into the plaster; once the
     sign is whole the three choices rise in front of it; picking one
     is the cut into the hero. The sign is decoration — the section is
     labelled and the three links are the content. -->

    <div class="gate-wall" aria-hidden="true"></div>
    <div class="gate-sun" aria-hidden="true"></div>
